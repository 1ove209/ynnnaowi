<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카카오톡</title>
<style>
:root{
  --bg:#fff; --text:#1e1e1e; --sub:#8a8a8a; --line:#efefef; --bar:#fff;
  --chat-bg:#abc1d1; --mine:#fee500; --other:#fff; --tab:#9a9a9a; --tabon:#1e1e1e;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1c1e;--text:#f2f2f2;--sub:#8e8e93;--line:#2c2c2e;--bar:#1c1c1e;--chat-bg:#3b4a57;--other:#3a3a3c;--tab:#7a7a7a;--tabon:#fff}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#d9d9d9;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--text)}
#phone{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.15)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
.status{height:calc(env(safe-area-inset-top,0px) + 6px)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px}
header h1{font-size:21px;font-weight:700}
header .ic{display:flex;gap:18px}
header svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.tmc{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.un{color:#e7a900;font-size:11px;font-weight:700;line-height:1}
#banner{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;background:var(--bg);color:var(--text);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.28);padding:10px 12px;display:flex;align-items:center;gap:10px;transform:translateY(-160%);transition:transform .35s ease;cursor:pointer}
#banner.on{transform:translateY(0)}
#banner .av{width:38px;height:38px;border-radius:14px}
#banner .bt{flex:1;min-width:0}
#banner .bn{font-size:13px;font-weight:700}
#banner .bm{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#banner .bk{font-size:11px;color:var(--sub);align-self:flex-start}
#callscreen{position:absolute;inset:0;z-index:70;background:linear-gradient(#2b3a4a,#10161d);color:#fff;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 24px calc(env(safe-area-inset-bottom,0px) + 48px)}
#callscreen.on{display:flex}
.cs-label{font-size:13px;opacity:.7}
.cs-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.cs-av{width:120px;height:120px;border-radius:44px;overflow:hidden;background:#555}
.cs-av img{width:100%;height:100%;object-fit:cover;display:block}
.cs-name{font-size:24px;font-weight:700}
.cs-sub{font-size:15px;opacity:.85;min-height:22px}
.cs-btns{display:flex;gap:56px}
.cs-b{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;cursor:pointer;border:0;background:none;color:#fff;font-family:inherit}
.cs-b i{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cs-b svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cs-red i{background:#ff4b3a}
.cs-red svg{transform:rotate(135deg)}
.cs-green i{background:#2fc85a}
#modal{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#modalBox{width:78%;max-width:320px;background:var(--bg);color:var(--text);border-radius:16px;overflow:hidden}
.md-t{padding:26px 20px 22px;font-size:15px;line-height:1.55;text-align:center;white-space:pre-line}
.md-b{display:flex;border-top:1px solid var(--line)}
.md-b button{flex:1;padding:14px 0;border:0;background:none;font-size:15px;color:var(--text);cursor:pointer;font-family:inherit}
.md-b button+button{border-left:1px solid var(--line)}
.md-b .danger{color:#e5483b;font-weight:600}
.inp input:disabled{opacity:.6}
.scroll{flex:1;overflow-y:auto}
.profile{display:flex;align-items:center;gap:12px;padding:12px 16px}
.av{width:44px;height:44px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;overflow:hidden}
.profile .av{width:52px;height:52px;border-radius:20px}
.nm{font-size:15px;font-weight:600}
.st{font-size:12px;color:var(--sub);margin-top:2px}
.sec{font-size:12px;color:var(--sub);padding:12px 16px 6px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}
.row:active{background:var(--line)}
.row .mid{flex:1;min-width:0}
.row .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.row .l1 .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{font-size:11px;color:var(--sub);flex:none}
.row .l2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px}
.row .pv{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:#ff4b3a;color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center;flex:none}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--bar);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--tab);cursor:pointer;position:relative}
.tab.on{color:var(--tabon)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on svg{fill:currentColor}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px)}
.soon{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px}

/* chat room */
#room{background:var(--chat-bg)}
.rh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--chat-bg);color:var(--text)}
.rh .back{cursor:pointer;padding:4px;display:flex}
.rh svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rh .t{font-size:17px;font-weight:700;flex:1}
.rh .ic{display:flex;gap:16px}
#msgs{flex:1;overflow-y:auto;padding:6px 12px 14px}
.date{text-align:center;margin:12px auto 14px;font-size:11px;color:#fff;background:rgba(0,0,0,.2);width:fit-content;padding:4px 14px;border-radius:12px}
.m{display:flex;margin:5px 0;align-items:flex-end;gap:6px}
.m.me{flex-direction:row-reverse}
.m .av{width:38px;height:38px;border-radius:15px;align-self:flex-start;font-size:15px}
.col{display:flex;flex-direction:column;max-width:68%}
.m .who{font-size:12px;color:var(--text);margin:0 0 4px 2px;opacity:.85}
.bw{display:flex;align-items:flex-end;gap:5px}
.m.me .bw{flex-direction:row-reverse}
.b{padding:8px 11px;border-radius:14px;font-size:14.5px;line-height:1.4;word-break:break-word;background:var(--other);color:var(--text);white-space:pre-wrap}
.m.me .b{background:var(--mine);color:#1e1e1e}
.tm{font-size:10px;color:rgba(30,30,30,.65);flex:none;white-space:nowrap}
@media (prefers-color-scheme: dark){.tm{color:rgba(255,255,255,.6)}}
.m.me .tm{text-align:right}
.read{color:#e7a900;font-size:10px;display:block;text-align:right}
.call{display:flex;justify-content:center;margin:10px 0}
.call .cb{background:var(--other);color:var(--text);border-radius:14px;padding:11px 16px;font-size:13.5px;display:flex;align-items:center;gap:10px;min-width:210px;max-width:80%}
.call .ci{width:32px;height:32px;border-radius:50%;background:#f3f3f3;display:flex;align-items:center;justify-content:center;flex:none}
@media (prefers-color-scheme: dark){.call .ci{background:#4a4a4c}}
.call svg{width:17px;height:17px;stroke:#555;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme: dark){.call svg{stroke:#ddd}}
.call .ct b{display:block;font-weight:600;font-size:13.5px}
.call .ct span{font-size:12px;color:var(--sub)}
.call .ct.red b{color:#e5483b}
.inp{display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar)}
.inp .plus{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none}
.inp .plus svg{width:22px;height:22px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round}
.inp input{flex:1;min-width:0;background:var(--line);border:0;outline:0;border-radius:18px;padding:9px 14px;font-size:16px;color:var(--text);font-family:inherit}
.inp input::placeholder{color:var(--sub)}
.inp .send{width:34px;height:34px;border-radius:50%;background:var(--line);border:0;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.inp .send svg{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.inp .send.on{background:var(--mine)}
.inp .send.on svg{stroke:#1e1e1e}
.b.typing{display:flex;gap:4px;padding:13px 14px;white-space:normal}
.b.typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:blink 1.2s infinite}
.b.typing i:nth-child(2){animation-delay:.2s}
.b.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.hint{font-size:11px;text-align:center;color:var(--sub);padding:6px;background:var(--bar)}
</style>
</head>
<body>
<div id="phone">

  <!-- 친구 -->
  <section class="screen on" id="friends">
    <div class="status"></div>
    <header><h1>친구</h1>
      <div class="ic">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"/><path d="M2 20c0-4 4-6 8-6M19 8v6M16 11h6"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
      </div>
    </header>
    <div class="scroll" id="friendList"></div>
    <nav class="tabs" data-for="friends"></nav>
  </section>

  <!-- 채팅 목록 -->
  <section class="screen" id="chats">
    <div class="status"></div>
    <header><h1>채팅</h1>
      <div class="ic">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v5M9.5 10.5h5"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
      </div>
    </header>
    <div class="scroll" id="chatList"></div>
    <nav class="tabs" data-for="chats"></nav>
  </section>

  <!-- 기타 탭 -->
  <section class="screen" id="more">
    <div class="status"></div>
    <header><h1 id="moreTitle">더보기</h1><div></div></header>
    <div class="soon">준비 중이에요</div>
    <nav class="tabs" data-for="more"></nav>
  </section>

  <!-- 채팅방 -->
  <section class="screen" id="room">
    <div class="status" style="background:var(--chat-bg)"></div>
    <div class="rh">
      <div class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="t" id="roomTitle"></div>
      <div class="ic">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <svg id="menuBtn" viewBox="0 0 24 24" style="cursor:pointer"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </div>
    </div>
    <div id="msgs"></div>
    <div class="inp">
      <div class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      <input id="txt" type="text" placeholder="메시지 입력" autocomplete="off" enterkeyhint="send">
      <button id="send" class="send" aria-label="전송"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </section>
  <div id="modal"><div id="modalBox"></div></div>
  <div id="banner"></div>
  <div id="callscreen">
    <div class="cs-label" id="csLabel">보이스톡</div>
    <div class="cs-mid"><div class="cs-av" id="csAv"></div><div class="cs-name" id="csName"></div><div class="cs-sub" id="csSub"></div></div>
    <div class="cs-btns" id="csBtns"></div>
  </div>
</div>

function avatar(r,style){
  style = style||'';
  if(r.img) return `<div class="av" style="${style}"><img src="${r.img}" alt=""></div>`;
  const s = r.ch.length>1 ? "font-size:10px;" : "";

function totalUnread(){return rooms.reduce((a,r)=>a+r.unread,0)}
function buildTabs(){
  const n = totalUnread();
  document.querySelectorAll('.tabs').forEach(nav=>{
    const cur = nav.dataset.for;
    nav.innerHTML = tabDefs.map(([id,l,ic])=>{
      const badge = id==="chats" ? `<span class="badge" style="${n?'':'display:none'}">${n}</span>`:"";
      return `<div class="tab ${id===cur?'on':''}" data-t="${id}">${ic}<span>${l}</span>${badge}</div>`;
    }).join("");
  });
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    const id=t.dataset.t;
    if(id==="friends"||id==="chats") show(id);
    else { document.getElementById('moreTitle').textContent=t.querySelector('span').textContent; show("more"); }
  });
}

  const n=totalUnread();
  document.querySelectorAll('.tab[data-t="chats"] .badge').forEach(b=>{b.textContent=n;b.style.display=n?'':'none'});
}

  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));

}

let current = null;
const typingState = {};
const msgsEl = document.getElementById('msgs');
const txt = document.getElementById('txt');
const sendBtn = document.getElementById('send');

function msgHTML(r, data, i){
  const m = data[i];
  if(m.w==="s") return `<div class="date" style="margin:10px auto">${esc(m.t)}</div>`;
  if(m.w==="c"){
    return `<div class="call"><div class="cb"><div class="ci">${icons[m.k]}</div>
      <div class="ct ${m.red?'red':''}"><b>${m.title}</b>${m.sub?`<span>${m.sub}</span>`:""}</div></div></div>`;
  }
  const prev = data[i-1];
  const first = !prev || prev.w!==m.w;
  if(m.w==="m"){
    const tmH = m.un ? `<div class="tmc"><span class="un">1</span><span class="tm">${m.time}</span></div>` : `<div class="tm">${m.time}</div>`;
    return `<div class="m me"><div class="col"><div class="bw"><div class="b">${esc(m.t)}</div>${tmH}</div></div></div>`;
  }
  return `<div class="m">${first?avatar(r,'width:38px;height:38px;border-radius:15px;'):'<div style="width:38px;flex:none"></div>'}
    <div class="col">${first?`<div class="who">${r.name}</div>`:""}<div class="bw"><div class="b">${esc(m.t)}</div><div class="tm">${m.time}</div></div></div></div>`;
}
function typingHTML(r){
  const data = convo[r.id], last = data[data.length-1];
  const first = !last || last.w!=="o";
  return `<div class="m" id="typing">${first?avatar(r,'width:38px;height:38px;border-radius:15px;'):'<div style="width:38px;flex:none"></div>'}
    <div class="col">${first?`<div class="who">${r.name}</div>`:""}<div class="bw"><div class="b typing"><i></i><i></i><i></i></div></div></div></div>`;
}
function scrollDown(){msgsEl.scrollTop = msgsEl.scrollHeight}
function showTyping(id){
  typingState[id]=true;
  if(current!==id) return;
  hideTypingEl();
  msgsEl.insertAdjacentHTML('beforeend', typingHTML(byId(id)));
  scrollDown();
}
function hideTypingEl(){const t=document.getElementById('typing'); if(t) t.remove();}

function openRoom(id){
  const r = byId(id);
  current = id;
  r.unread = 0;
  document.getElementById('roomTitle').textContent = r.name;
  const data = convo[id];
  let html = `<div class="date">${r.date||"2026년 10월 23일 금요일"}</div>`;
  for(let i=0;i<data.length;i++) html += msgHTML(r,data,i);
  if(typingState[id]) html += typingHTML(r);
  msgsEl.innerHTML = html;
  show("room");
  scrollDown();
  renderChatList(); updateBadge();
  updateInputState(id);
}
function leaveRoom(){
  current = null;
  txt.blur();
  show("chats");
}

function pushMsg(id, m){
  const data = convo[id], r = byId(id);
  if(m.w==="o" && r.blocked) return;
  if(m.w==="s"){
    data.push(m);
    if(current===id){ msgsEl.insertAdjacentHTML('beforeend', msgHTML(r,data,data.length-1)); scrollDown(); }
    return;
  }
  data.push(m);
  r.pv = m.w==="c" ? (m.pv||m.title) : m.t;
  r.time = m.time || nowStr();
  if(m.w==="o"){
    typingState[id]=false;
    if(current!==id){ r.unread++; showBanner(id, m.t); }
  }
  if(current===id){
    hideTypingEl();
    msgsEl.insertAdjacentHTML('beforeend', msgHTML(r,data,data.length-1));
    scrollDown();
  }
  const k = chatOrder.indexOf(id); chatOrder.splice(k,1); chatOrder.unshift(id);
  renderChatList(); updateBadge();
}

/* ---------- 답장 로직 ---------- */
const pick = a => a[Math.floor(Math.random()*a.length)];
const burst = pool => { const r = pick(pool); return Array.isArray(r) ? r : [r]; };
const norm = s => s.replace(/[\s!?.,~…]+/g,"");
const WHAT = /[뭐머모]\s*(해|하|함|햄)/;
const FOOD = /밥|먹|점심|저녁|배고|맛있|맛집|마라|곱창|치킨|피자|라면|떡볶이|고기|삼겹|족발|빵|디저트|케이크|카페|커피|웨이팅|찹쌀떡/;
const THANKS = /고마|감사/, SORRY = /미안|죄송/, GN = /잘자|굿나잇|자러|졸려/, TIRED = /힘들|피곤|지쳐/, HI = /^(안녕|ㅎㅇ|하이|헬로)/, LAUGH = /^(ㅋ|ㅎ)+$/;
const AFFECT = /사랑|좋아해|좋아한다|좋아함|보고\s*싶|애정|뽀뽀|하트|♥|♡|❤|love|luv/i;
const INSULT = /바보|멍청|멍충|병신|븅신|ㅂㅅ|씨발|시발|ㅅㅂ|ㅆㅂ|좆|존나|지랄|ㅈㄹ|꺼져|닥쳐|미친|새끼|개새|썅|등신|돌아이|죽어/;
const CALLREQ = /전화|통화|보이스톡|보톡/;

let shPending = false, heartPending = false, heartAngry = false, pendingAfter = null;

function triggerHeart(){
  if(heartPending || heartAngry) return;
  heartPending = true;
  setTimeout(()=>{
    heartPending = false;
    if(byId("heart").blocked) return;
    heartAngry = true;
    pushMsg("heart", {w:"o", t:"오빠 뭐해?", time:nowStr()});
  }, 3200 + Math.random()*1500);
}

function shClassify(t){
  if(/안\s*싸|싸우지\s*않|싸우진|안\s*싸워|잘\s*지내|잘\s*사귀|잘\s*돼|잘\s*되|잘\s*만나/.test(t)) return "pos";
  if(/싸웠|싸워|싸운|싸우|안\s*좋|별로|힘들|헤어|권태|최악|안\s*맞|짜증|ㅠ|ㅜ/.test(t)) return "neg";
  if(/^(아니|아뇨|아니요|아니야|아니여|아냐|노|ㄴㄴ)+$/.test(norm(t))) return "neg";
  if(/^(응|웅|네|넹|넵|예|ㅇㅇ|ㅇㅋ|당연|물론|굿|좋|행복|사랑|ㅎㅎ|ㅋㅋ|잘)/.test(t)) return "pos";
  return null;
}

function jay(t){
  const n = norm(t);
  if(INSULT.test(t)) return [pick(["야 니가 더 바보지","뭐래;;","응 니똥굵다"])];
  if(/서윤/.test(t)) return ["그걸 왜 나한테 얘기하니;;"];
  if(AFFECT.test(t)) return [pick(["?","장난치지마라","더럽게 뭐라는거야;;","하지마"])];
  if(CALLREQ.test(t)){
    pendingAfter = async ()=>{ await sleep(3000); openCall("jay"); };
    return ["지금??","기다려봐"];
  }
  if(WHAT.test(t)) return ["그냥 있음"];
  if(/^(제이형아|제이형|제이야|제이아|제이|형|야)+$/.test(n)) return ["응?"];

const sleep = ms => new Promise(r=>setTimeout(r,ms));
const queues = {};
function schedule(id, replies, delay, after){
  queues[id] = (queues[id]||Promise.resolve()).then(async ()=>{
    await sleep(delay!=null ? delay : 600 + Math.random()*600);
    for(const t of replies){
      if(byId(id).blocked) break;
      showTyping(id);
      await sleep(Math.min(2600, 700 + t.length*80));
      pushMsg(id, {w:"o", t, time:nowStr()});
      await sleep(250);
    }
    if(after) await after();
  });
}
const openPending = {};
let lastActive = Date.now();
let hsCount = 0;
function sendMessage(){
  const t = txt.value.trim();
  if(!t || !current || byId(current).blocked) return;
  const id = current;
  txt.value = "";
  sendBtn.classList.remove('on');
  openPending[id] = false;
  lastActive = Date.now();
  pushMsg(id, {w:"m", t, time:nowStr(), un: id==="hs"});
  if(id==="hs"){
    hsCount++;
    if(hsCount>=10){
      const hr = byId(id);
      hr.blocked = true; hr.locked = true;
      pushMsg(id, {w:"s", t:"더 이상 메시지를 보낼 수 없어요. 차단된 대화상대예요."});
      updateInputState(id);
      return;
    }
  }
  pendingAfter = null;
  const replies = getReplies(id, t);
  const after = pendingAfter; pendingAfter = null;
  if(replies.length || after) schedule(id, replies, null, after);
  txt.focus();
}

const PHONE = '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>';
let callActive = false, callRoom = null, callTok = 0, callTimer = null, callStart = 0;
const callEl = document.getElementById('callscreen');
const csSub = document.getElementById('csSub');
const csBtns = document.getElementById('csBtns');
const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

function openCall(id){
  if(callActive || byId(id).blocked) return;
  callActive = true; callRoom = id;
  const tok = ++callTok;
  const r = byId(id);
  bannerEl.classList.remove('on');
  document.getElementById('csAv').innerHTML = `<img src="${r.img}" alt="">`;
  document.getElementById('csName').textContent = r.name;

  document.getElementById('csDecline').onclick = declineCall;
  document.getElementById('csAccept').onclick = acceptCall;
  callEl.classList.add('on');
  callTimer = setTimeout(()=>{ if(tok===callTok) declineCall(); }, 30000);
}
function declineCall(){
  clearTimeout(callTimer); callTok++;
  const id = callRoom;
  callEl.classList.remove('on'); callActive = false;
  pushMsg(id, {w:"c", k:"voice", title:"보이스톡 거절", sub:"거절했어요", red:1, time:nowStr()});
  schedule(id, ["전화 하자 해놓고","왜 끊음??"], 1000);
}
async function acceptCall(){
  clearTimeout(callTimer);
  const tok = ++callTok;
  callStart = Date.now();
  csSub.textContent = "...";
  csBtns.innerHTML = `<button class="cs-b cs-red" id="csEnd"><i>${PHONE}</i>종료</button>`;
  document.getElementById('csEnd').onclick = ()=>endCall(tok);
  for(const line of ["왜 하자고 했냐?","용건 없으면 끊는다"]){
    await sleep(1000);
    if(tok!==callTok) return;
    csSub.textContent = line;
  }
  await sleep(1000);
  endCall(tok);
}
function endCall(tok){
  if(tok!==callTok) return;
  callTok++;
  const id = callRoom;
  const secs = Math.max(1, Math.round((Date.now()-callStart)/1000));
  callEl.classList.remove('on'); callActive = false;
  pushMsg(id, {w:"c", k:"voice", title:"보이스톡", sub:`통화 시간 ${fmt(secs)}`, pv:`보이스톡 통화 ${fmt(secs)}`, time:nowStr()});
}

const IDLE_MS = 60000;
function scheduleOpener(){
  setInterval(()=>{
    if(callActive || Date.now() - lastActive < IDLE_MS) return;
    const ids = Object.keys(openers).filter(id=>!openPending[id] && !byId(id).blocked);
    if(!ids.length) return;
    const id = pick(ids);
    openPending[id] = true;
    lastActive = Date.now();
    schedule(id, [openers[id]], 0);
  }, 1000);
}

  sw: n => ["야 정원아ㅋㅋㅋ", "너 "+n+" 차단했어???", "걔 나한테 와서 차단 풀어달라고 난리임 ㅋㅋㅋㅋ", "도대체 무슨 짓을 한 거야 ㅋㅋㅋㅋ", "빨리 풀어줘~~ 불쌍하잖아"],
  jake: n => ["정원~~~!!", n+" 차단했어??", "걔가 나한테 차단 풀어달라구 했어 ㅠㅠ", "무슨일 있엇어?? 어떻해 좀 풀어주면 안되?", "정원이 맘 풀리면 풀어줘~~!!"],
  nikki: n => ["정원이형", n+" 차단했어요?", "걔가 풀어달라던데요 ㅋ", "귀찮으니까 그냥 풀어주세요 ㅎ"]
};
function notifyUnblockRequest(blockedId){
  const pool = Object.keys(unblockMsgs).filter(id => id!==blockedId && !byId(id).blocked);
  if(!pool.length) return;
  const id = pick(pool);
  schedule(id, unblockMsgs[id](shortNm[blockedId]), 4000 + Math.random()*4000);
}
function blockRoom(id){
  const r = byId(id);
  r.blocked = true;
  typingState[id] = false;
  if(current===id) hideTypingEl();
  pushMsg(id, {w:"s", t:`${r.name}님을 차단했어요`});
  updateInputState(id);
  if(shortNm[id]) notifyUnblockRequest(id);
}
function unblockRoom(id){
  const r = byId(id);
  if(r.locked) return;
  r.blocked = false;
  pushMsg(id, {w:"s", t:`${r.name}님의 차단을 해제했어요`});
  updateInputState(id);
}
document.getElementById('menuBtn').addEventListener('click', ()=>{
  if(!current) return;
  const id = current, r = byId(id);
  if(r.locked) return openModal("더 이상 메시지를 보낼 수 없는 대화상대예요.", [{label:"확인"}]);
  if(r.blocked) return openModal(`${r.name}님의 차단을 해제하시겠어요?`, [{label:"취소"},{label:"차단 해제", cls:"danger", fn:()=>unblockRoom(id)}]);
  openModal(`${r.name}님을 차단하시겠어요?\n차단하면 더 이상 메시지를 주고받을 수 없어요.`, [{label:"취소"},{label:"차단", cls:"danger", fn:()=>blockRoom(id)}]);
});

document.getElementById('friendList').addEventListener('click', e=>{const row=e.target.closest('.row'); if(row) openRoom(row.dataset.id)});
document.getElementById('chatList').addEventListener('click', e=>{const row=e.target.closest('.row'); if(row) openRoom(row.dataset.id)});
document.getElementById('back').onclick = leaveRoom;

renderChatList();
buildTabs();
scheduleOpener();
</script>
